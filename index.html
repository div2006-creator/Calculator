<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <meta name="description"
    content="A sleek, modern basic calculator, and responsive light design.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <main class="calculator-card" id="calculator">
      <section class="calc-display-section" id="display-section">
        <div class="expression-line" id="expression-display" aria-label="Current expression"></div>
        <div class="result-line" id="result-display" aria-label="Calculation result">0</div>
      </section>

      <section class="keypad-grid" id="keypad">
        <button class="btn action-btn danger" id="btn-ac" data-action="clear">AC</button>
        <button class="btn action-btn" id="btn-del" data-action="delete">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6M12 9l6 6" />
          </svg>
        </button>
        <button class="btn action-btn" data-action="insert" data-val="(">(</button>
        <button class="btn action-btn" data-action="insert" data-val=")">)</button>

        <button class="btn action-btn" data-action="op" data-val="%">%</button>
        <button class="btn action-btn" data-action="negate">±</button>
        <button class="btn op-btn" data-action="op" data-val="÷">÷</button>
        <button class="btn op-btn" data-action="op" data-val="×">×</button>

        <button class="btn num-btn" data-action="num" data-val="7">7</button>
        <button class="btn num-btn" data-action="num" data-val="8">8</button>
        <button class="btn num-btn" data-action="num" data-val="9">9</button>
        <button class="btn op-btn" data-action="op" data-val="-">-</button>

        <button class="btn num-btn" data-action="num" data-val="4">4</button>
        <button class="btn num-btn" data-action="num" data-val="5">5</button>
        <button class="btn num-btn" data-action="num" data-val="6">6</button>
        <button class="btn op-btn" data-action="op" data-val="+">+</button>

        <button class="btn num-btn" data-action="num" data-val="1">1</button>
        <button class="btn num-btn" data-action="num" data-val="2">2</button>
        <button class="btn num-btn" data-action="num" data-val="3">3</button>
        <button class="btn equals-btn" id="btn-equals" data-action="equals">=</button>

        <button class="btn num-btn zero-btn" data-action="num" data-val="0">0</button>
        <button class="btn num-btn" data-action="num" data-val=".">.</button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
